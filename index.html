<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Kom Bouffe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Karla:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #1E3A2B;
    --ink-light: #2C5340;
    --paper: #F4EFE1;
    --paper-dim: #E9E2CE;
    --orange: #E2601F;
    --plum: #4A1942;
    --charcoal: #201C18;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Karla',sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:920px;margin:0 auto;padding:2.5rem 1.5rem 5rem;}

  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2.5rem;flex-wrap:wrap;gap:.5rem;}
  header h1{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:2.6rem;
    letter-spacing:.02em;
    margin:0;
    color:var(--paper);
  }
  header .tag{font-family:'Space Mono',monospace;font-size:.8rem;color:var(--orange);text-transform:uppercase;letter-spacing:.08em;}

  .hero{margin-bottom:3rem;}
  .hero p{font-size:1.05rem;max-width:52ch;color:#DCD5C0;}

  .stamps{display:flex;flex-wrap:wrap;gap:.9rem;margin-top:1.5rem;}
  .stamp{
    font-family:'Space Mono',monospace;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    width:64px;height:64px;
    border-radius:50%;
    border:2px dashed var(--paper-dim);
    background:transparent;
    color:var(--paper-dim);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    text-align:center;
    transform:rotate(-3deg);
    transition:transform .15s ease, border-color .15s ease, color .15s ease;
  }
  .stamp:nth-child(even){transform:rotate(2deg);}
  .stamp:hover{border-color:var(--orange);color:var(--paper);}
  .stamp.active{
    border-style:solid;
    border-color:var(--orange);
    color:var(--paper);
    background:rgba(226,96,31,.18);
    transform:rotate(-3deg) scale(1.08);
  }

  .nav{display:flex;gap:.5rem;margin-bottom:2rem;flex-wrap:wrap;}
  .nav button{
    font-family:'Space Mono',monospace;
    font-size:.78rem;
    text-transform:uppercase;
    letter-spacing:.04em;
    background:transparent;
    color:var(--paper-dim);
    border:1px solid var(--ink-light);
    border-radius:3px;
    padding:.55rem 1rem;
    cursor:pointer;
  }
  .nav button:hover{border-color:var(--orange);color:var(--paper);}
  .nav button.active{background:var(--orange);border-color:var(--orange);color:var(--charcoal);}

  .view{display:none;}
  .view.open{display:block;}

  .seasonal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1.5rem;margin-bottom:1rem;}
  .seasonal-grid h4{
    font-family:'Space Mono',monospace;
    font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;
    color:var(--orange);margin:0 0 .6rem;
  }
  .seasonal-grid ul{list-style:none;margin:0;padding:0;}
  .seasonal-grid li{padding:.3rem 0;border-bottom:1px solid var(--ink-light);color:#DCD5C0;font-size:.92rem;}

  .search-row{display:flex;gap:.6rem;margin-bottom:1.5rem;}
  .search-row input{
    flex:1;padding:.6rem .8rem;border:1px solid var(--ink-light);border-radius:3px;
    font-family:'Karla',sans-serif;font-size:.92rem;background:var(--ink-light);color:var(--paper);
  }
  .search-row input::placeholder{color:#9CB0A2;}
  .search-row button{
    font-family:'Space Mono',monospace;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;
    background:var(--orange);color:var(--charcoal);border:none;border-radius:3px;padding:.6rem 1.2rem;cursor:pointer;
  }
  .search-result{
    background:var(--paper);color:var(--charcoal);border-radius:4px;padding:.9rem 1.1rem;margin-bottom:.7rem;cursor:pointer;
  }
  .search-result h4{font-family:'Anton',sans-serif;font-weight:400;font-size:1.05rem;margin:0 0 .2rem;}
  .search-result p{font-family:'Space Mono',monospace;font-size:.7rem;color:var(--ink-light);margin:0;text-transform:uppercase;letter-spacing:.05em;}

  .section-label{
    font-family:'Space Mono',monospace;
    font-size:.75rem;
    text-transform:uppercase;
    letter-spacing:.1em;
    color:var(--orange);
    margin:0 0 1rem;
  }

  .recipes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1rem;margin-bottom:3rem;}
  .card{
    background:var(--paper);
    color:var(--charcoal);
    border-radius:4px;
    padding:1.1rem 1.2rem 1.3rem;
    cursor:pointer;
    position:relative;
    transition:transform .12s ease;
    border:1px solid var(--paper-dim);
  }
  .card:hover{transform:translateY(-3px);}
  .card h3{
    font-family:'Anton',sans-serif;
    font-weight:400;
    font-size:1.15rem;
    margin:0 0 .35rem;
    letter-spacing:.01em;
  }
  .card .season{
    font-family:'Space Mono',monospace;
    font-size:.68rem;
    text-transform:uppercase;
    color:var(--ink-light);
    letter-spacing:.05em;
  }
  .card.selected{outline:2px solid var(--orange);}

  .detail{
    background:var(--paper);
    color:var(--charcoal);
    border-radius:4px;
    padding:1.6rem 1.8rem;
    margin-bottom:3rem;
    display:none;
  }
  .detail.open{display:block;}
  .detail h3{font-family:'Anton',sans-serif;font-weight:400;font-size:1.6rem;margin:0 0 .2rem;}
  .detail .season{font-family:'Space Mono',monospace;font-size:.72rem;color:var(--ink-light);text-transform:uppercase;letter-spacing:.05em;}

  .detail-body{display:flex;gap:2rem;margin-top:1.2rem;flex-wrap:wrap;}
  .ingredients{flex:1;min-width:220px;}
  .ingredients table{width:100%;border-collapse:collapse;font-family:'Space Mono',monospace;font-size:.82rem;}
  .ingredients td{padding:.35rem 0;border-bottom:1px solid var(--paper-dim);}
  .ingredients td:last-child{text-align:right;}

  .servings{display:flex;align-items:center;gap:.6rem;margin-bottom:1rem;font-family:'Space Mono',monospace;font-size:.82rem;}
  .servings input{
    width:56px;padding:.3rem .4rem;border:1px solid var(--ink-light);border-radius:3px;font-family:'Space Mono',monospace;font-size:.82rem;background:#fff;
  }

  .instructions{flex:1;min-width:220px;font-size:.92rem;}

  .add-toggle{
    font-family:'Space Mono',monospace;
    font-size:.85rem;
    background:transparent;
    color:var(--paper);
    border:2px solid var(--orange);
    border-radius:3px;
    padding:.7rem 1.3rem;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .add-toggle:hover{background:var(--orange);}

  .form{
    background:var(--paper);
    color:var(--charcoal);
    border-radius:4px;
    padding:1.6rem 1.8rem;
    margin-top:1.5rem;
    display:none;
  }
  .form.open{display:block;}
  .form label{
    display:block;
    font-family:'Space Mono',monospace;
    font-size:.72rem;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:var(--ink-light);
    margin:1rem 0 .3rem;
  }
  .form input, .form textarea{
    width:100%;padding:.5rem .6rem;border:1px solid var(--paper-dim);border-radius:3px;
    font-family:'Karla',sans-serif;font-size:.9rem;background:#fff;color:var(--charcoal);
  }
  .form textarea{resize:vertical;min-height:70px;}
  .ing-row{display:grid;grid-template-columns:2fr 1fr 1fr;gap:.5rem;margin-top:.4rem;}
  .submit-btn{
    margin-top:1.3rem;
    background:var(--ink);
    color:var(--paper);
    border:none;border-radius:3px;
    padding:.65rem 1.4rem;
    font-family:'Space Mono',monospace;
    font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;
    cursor:pointer;
  }
  .submit-btn:hover{background:var(--ink-light);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>Kom Bouffe</h1>
    <span class="tag">La Kfet · recettes de saison</span>
  </header>

  <div class="hero">
    <p>Des recettes végé, de saison, pensées pour nourrir toute une équipe de barmans.</p>
  </div>

  <div class="nav" id="nav">
    <button data-view="month" class="active">Choisir une recette</button>
    <button data-view="season">Fruits &amp; légumes de saison</button>
    <button data-view="search">Choisir mon aliment</button>
  </div>

  <div class="view open" id="view-month">
    <div class="stamps" id="stamps"></div>

    <p class="section-label" id="listLabel">Recettes — Mars</p>
    <div class="recipes" id="recipeList"></div>

    <div class="detail" id="detail">
      <h3 id="detailName"></h3>
      <p class="season" id="detailSeason"></p>
      <div class="detail-body">
        <div class="ingredients">
          <div class="servings">
            <label style="margin:0;">Barmans</label>
            <input type="number" id="servings" value="20" min="1">
          </div>
          <table id="ingredientTable"></table>
        </div>
        <div class="instructions" id="instructions"></div>
      </div>
    </div>
  </div>

  <div class="view" id="view-season">
    <div class="stamps" id="stamps2"></div>
    <p class="section-label" id="seasonLabel">Aliments de saison — Mars</p>
    <div class="seasonal-grid">
      <div>
        <h4>Légumes</h4>
        <ul id="seasonVeg"></ul>
      </div>
      <div>
        <h4>Fruits</h4>
        <ul id="seasonFruit"></ul>
      </div>
      <div>
        <h4>Céréales &amp; légumineuses</h4>
        <ul id="seasonGrain"></ul>
      </div>
    </div>
  </div>

  <div class="view" id="view-search">
    <p class="section-label">Quel aliment ?</p>
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="Ex. lentilles, courgette, riz...">
      <button id="searchBtn">Chercher</button>
    </div>
    <div id="searchResults"></div>
  </div>

  <p class="section-label">Une nouvelle recette ?</p>
  <button class="add-toggle" id="toggleForm">+ Ajouter une recette</button>

  <div class="form" id="form">
    <label>Nom de la recette</label>
    <input type="text" placeholder="Curry de lentilles">

    <label>Légume ou fruit de saison associé</label>
    <input type="text" placeholder="Carotte">

    <label>Ingrédients (par personne)</label>
    <div class="ing-row"><input placeholder="Ingrédient"><input placeholder="Qté / pers"><input placeholder="Unité"></div>
    <div class="ing-row"><input placeholder="Ingrédient"><input placeholder="Qté / pers"><input placeholder="Unité"></div>
    <div class="ing-row"><input placeholder="Ingrédient"><input placeholder="Qté / pers"><input placeholder="Unité"></div>

    <label>Instructions</label>
    <textarea placeholder="Fais revenir les oignons..."></textarea>

    <button class="submit-btn">Enregistrer la recette</button>
  </div>

</div>

<script>
const MOIS = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'];
const MOIS_FULL = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];

const RECIPES = [
  {name:"Curry de lentilles", months:[0,1,2,10,11], ingredients:[["Lentilles corail","80","g"],["Lait de coco","100","ml"],["Oignon","0.3","piece"],["Curry en poudre","5","g"]], instructions:"Fais revenir l'oignon, ajoute le curry, les lentilles rincées et le lait de coco. Laisse mijoter 20 min."},
  {name:"Croziflette", months:[0,1,11], ingredients:[["Crozets","100","g"],["Reblochon","40","g"],["Lardons fumés","30","g"],["Oignon","0.2","piece"]], instructions:"Cuis les crozets, fais revenir lardons et oignons, mélange le tout et gratine au four avec le reblochon."},
  {name:"Blé aux champignons", months:[8,9,10], ingredients:[["Blé","70","g"],["Champignons de Paris","100","g"],["Ail","1","gousse"],["Persil","5","g"]], instructions:"Cuis le blé, poêle les champignons avec l'ail, mélange et parsème de persil frais."},
  {name:"Tortilla", months:[2,3,4,5], ingredients:[["Pomme de terre","150","g"],["Oeuf","1","piece"],["Oignon","0.3","piece"]], instructions:"Fais cuire les pommes de terre en fines tranches avec l'oignon, ajoute les oeufs battus et cuis à la poêle des deux côtés."},
  {name:"Riz à la crème de poireaux", months:[9,10,11,0], ingredients:[["Riz","70","g"],["Poireau","1","piece"],["Crème fraîche","30","g"]], instructions:"Cuis le riz. Fais fondre les poireaux émincés puis ajoute la crème. Mélange au riz."},
  {name:"Lentilles à la marocaine", months:[10,11,0,1], ingredients:[["Lentilles vertes","80","g"],["Tomates concassées","80","g"],["Cumin","3","g"],["Raisins secs","10","g"]], instructions:"Fais revenir les épices, ajoute tomates et lentilles, laisse mijoter puis ajoute les raisins secs en fin de cuisson."},
  {name:"Gnocchis ratatouille", months:[5,6,7,8], ingredients:[["Gnocchis","150","g"],["Courgette","0.5","piece"],["Aubergine","0.3","piece"],["Poivron","0.3","piece"]], instructions:"Fais revenir les légumes coupés en dés, ajoute une sauce tomate, et sers avec les gnocchis poêlés."},
  {name:"Pâtes au pesto", months:[3,4,5,6], ingredients:[["Pâtes","100","g"],["Basilic","10","g"],["Parmesan","15","g"],["Pignons de pin","10","g"]], instructions:"Mixe basilic, parmesan, pignons et huile d'olive. Mélange aux pâtes cuites."},
];

const CALENDAR = [
  {veg:["Poireau","Chou","Céleri-rave","Carotte","Betterave"], fruit:["Clémentine","Orange","Kiwi","Pomme"], grain:["Lentille","Blé"]},
  {veg:["Poireau","Chou","Endive","Carotte","Céleri-branche"], fruit:["Orange","Kiwi","Pamplemousse"], grain:["Lentille","Pois cassé"]},
  {veg:["Poireau","Épinard","Carotte","Radis"], fruit:["Pomme","Poire","Citron"], grain:["Lentille","Riz"]},
  {veg:["Asperge","Radis","Épinard","Petit pois"], fruit:["Pomme","Fraise"], grain:["Blé","Pois chiche"]},
  {veg:["Asperge","Petit pois","Radis","Artichaut"], fruit:["Fraise","Cerise","Rhubarbe"], grain:["Blé"]},
  {veg:["Courgette","Petit pois","Artichaut","Fenouil"], fruit:["Cerise","Abricot","Fraise"], grain:["Riz"]},
  {veg:["Courgette","Tomate","Poivron","Aubergine"], fruit:["Abricot","Pêche","Melon"], grain:["Blé"]},
  {veg:["Tomate","Poivron","Aubergine","Concombre"], fruit:["Pêche","Melon","Prune"], grain:["Riz"]},
  {veg:["Tomate","Champignon","Courge","Poivron"], fruit:["Raisin","Prune","Figue"], grain:["Blé","Lentille"]},
  {veg:["Champignon","Courge","Chou","Céleri-rave"], fruit:["Raisin","Kaki","Coing"], grain:["Lentille"]},
  {veg:["Chou","Poireau","Céleri-rave","Betterave"], fruit:["Kaki","Clémentine","Poire"], grain:["Lentille","Pois cassé"]},
  {veg:["Chou","Poireau","Endive","Carotte"], fruit:["Clémentine","Orange","Mandarine"], grain:["Lentille"]},
];

let currentMonth = 2;
let selectedRecipe = null;
let currentView = 'month';

function buildStamps(el, onClick){
  MOIS.forEach((m, i) => {
    const b = document.createElement('button');
    b.className = 'stamp' + (i === currentMonth ? ' active' : '');
    b.textContent = m;
    b.onclick = onClick(i);
    el.appendChild(b);
  });
}
buildStamps(document.getElementById('stamps'), i => () => { currentMonth = i; renderAll(); });
buildStamps(document.getElementById('stamps2'), i => () => { currentMonth = i; renderAll(); });

document.getElementById('nav').addEventListener('click', e => {
  const btn = e.target.closest('button[data-view]');
  if(!btn) return;
  currentView = btn.dataset.view;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.view').forEach(v => v.classList.remove('open'));
  document.getElementById('view-' + currentView).classList.add('open');
});

function renderAll(){
  document.querySelectorAll('.stamp').forEach(s => s.classList.toggle('active', s.textContent === MOIS[currentMonth]));
  render();
  renderSeason();
}

function renderSeason(){
  document.getElementById('seasonLabel').textContent = 'Aliments de saison — ' + MOIS_FULL[currentMonth];
  const cal = CALENDAR[currentMonth];
  const fill = (id, arr) => {
    const ul = document.getElementById(id);
    ul.innerHTML = arr.map(x => '<li>' + x + '</li>').join('');
  };
  fill('seasonVeg', cal.veg);
  fill('seasonFruit', cal.fruit);
  fill('seasonGrain', cal.grain);
}

document.getElementById('searchBtn').addEventListener('click', runSearch);
document.getElementById('searchInput').addEventListener('keydown', e => { if(e.key === 'Enter') runSearch(); });

function runSearch(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const results = document.getElementById('searchResults');
  results.innerHTML = '';
  if(!q) return;
  const matches = RECIPES.filter(r => r.ingredients.some(([name]) => name.toLowerCase().includes(q)));
  if(matches.length === 0){
    results.innerHTML = '<p style="color:#DCD5C0;">Aucune recette trouvée pour "' + q + '".</p>';
    return;
  }
  matches.forEach(r => {
    const el = document.createElement('div');
    el.className = 'search-result';
    el.innerHTML = '<h4>' + r.name + '</h4><p>Mois recommandés — ' + r.months.map(i => MOIS[i]).join(', ') + '</p>';
    el.onclick = () => {
      selectedRecipe = r;
      currentMonth = r.months[0];
      document.querySelector('#nav button[data-view="month"]').click();
      renderAll();
      renderDetail();
    };
    results.appendChild(el);
  });
}

function render(){
  document.getElementById('listLabel').textContent = 'Recettes — ' + MOIS_FULL[currentMonth];

  const list = document.getElementById('recipeList');
  list.innerHTML = '';
  const matches = RECIPES.filter(r => r.months.includes(currentMonth));
  matches.forEach(r => {
    const c = document.createElement('div');
    c.className = 'card' + (selectedRecipe === r ? ' selected' : '');
    c.innerHTML = '<h3>' + r.name + '</h3>';
    c.onclick = () => { selectedRecipe = r; renderDetail(); render(); };
    list.appendChild(c);
  });
  if(matches.length === 0){
    list.innerHTML = '<p style="color:#DCD5C0;grid-column:1/-1;">Aucune recette pour ce mois pour l\'instant.</p>';
  }
}

function renderDetail(){
  const d = document.getElementById('detail');
  if(!selectedRecipe){ d.classList.remove('open'); return; }
  d.classList.add('open');
  document.getElementById('detailName').textContent = selectedRecipe.name;
  document.getElementById('detailSeason').textContent = selectedRecipe.months.map(i => MOIS[i]).join(' · ');
  document.getElementById('instructions').textContent = selectedRecipe.instructions;
  updateIngredients();
  d.scrollIntoView({behavior:'smooth', block:'nearest'});
}

function updateIngredients(){
  const servings = parseFloat(document.getElementById('servings').value) || 1;
  const table = document.getElementById('ingredientTable');
  table.innerHTML = '';
  selectedRecipe.ingredients.forEach(([name, qty, unit]) => {
    const total = (parseFloat(qty) * servings).toFixed(1).replace(/\.0$/, '');
    const row = document.createElement('tr');
    row.innerHTML = '<td>' + name + '</td><td>' + total + ' ' + unit + '</td>';
    table.appendChild(row);
  });
}
document.getElementById('servings').addEventListener('input', () => { if(selectedRecipe) updateIngredients(); });

document.getElementById('toggleForm').addEventListener('click', () => {
  document.getElementById('form').classList.toggle('open');
});

renderAll();
</script>
</body>
</html>
